name: reelspay
description: ReelsPay — watch short dramas and earn money every 20 seconds.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_mobile_ads: ^9.2.0
  provider: ">=6.0.0 <7.0.0"
  shared_preferences: ">=2.0.0 <3.0.0"
  video_player: ">=2.7.0 <3.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=3.0.0 <7.0.0"

flutter:
  uses-material-design: true
  assets:
    - assets/posters/
    - assets/videos/
